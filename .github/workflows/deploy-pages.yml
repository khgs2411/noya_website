name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Bump patch version
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run version:patch
          git add package.json bun.lock
          git commit -m "Bump app version [skip ci]"
          git push

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure SSH for private dependencies
        env:
          CLASS_KIT_SDK_DEPLOY_KEY: ${{ secrets.CLASS_KIT_SDK_DEPLOY_KEY }}
        run: |
          test -n "$CLASS_KIT_SDK_DEPLOY_KEY" || { echo "CLASS_KIT_SDK_DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$CLASS_KIT_SDK_DEPLOY_KEY" > ~/.ssh/class_kit_sdk
          chmod 600 ~/.ssh/class_kit_sdk
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/class_kit_sdk -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_TARGET: ${{ vars.VITE_SUPABASE_TARGET }}
          VITE_REMOTE_SUPABASE_URL: ${{ vars.VITE_REMOTE_SUPABASE_URL }}
          VITE_REMOTE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_REMOTE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_URL: ${{ vars.VITE_AUTH_REDIRECT_URL }}
        run: bun run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
